<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <!-- Court Perspective Grid Lines (Background Accent) -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.6">
    <line x1="50" y1="420" x2="450" y2="380" stroke-dasharray="8 6"/>
    <line x1="120" y1="470" x2="480" y2="320"/>
    <line x1="220" y1="490" x2="380" y2="260" stroke-dasharray="6 6"/>
    <!-- Court corner angle marker -->
    <path d="M 40 450 L 160 450 L 260 350" fill="none" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Speed Motion Trails -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.5">
    <path d="M 70 340 C 120 330, 180 300, 220 270" stroke-width="3" stroke-dasharray="12 10"/>
    <path d="M 90 390 C 150 375, 220 340, 260 300" stroke-width="4" stroke-dasharray="16 12"/>
    <path d="M 130 430 C 190 410, 250 370, 280 330" stroke-width="3" stroke-dasharray="10 8"/>
  </g>

  <!-- Shuttlecock (Main Subject - Angled 45 deg) -->
  <g transform="translate(180, 80) rotate(28)">
    <!-- Feather Fan Outlines -->
    <path d="M 70 180 L 10 20 C 60 5, 140 5, 190 20 L 130 180 Z" 
          fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Feathers Outer Rim Arc -->
    <path d="M 10 20 Q 100 -5 190 20" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M 22 55 Q 100 32 178 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4"/>

    <!-- Feathers Lower Binding Threads (Two Thread Arcs) -->
    <path d="M 38 100 Q 100 80 162 100" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 48 135 Q 100 118 152 135" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>

    <!-- Feather Shafts (Vanes) -->
    <line x1="74" y1="180" x2="18" y2="22" stroke="#FFFFFF" stroke-width="3.2"/>
    <line x1="82" y1="180" x2="42" y2="13" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="90" y1="180" x2="70" y2="8" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="100" y1="180" x2="100" y2="6" stroke="#FFFFFF" stroke-width="3.5"/>
    <line x1="110" y1="180" x2="130" y2="8" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="118" y1="180" x2="158" y2="13" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="126" y1="180" x2="182" y2="22" stroke="#FFFFFF" stroke-width="3.2"/>

    <!-- Individual Feather Overlap Tips -->
    <path d="M 10 20 C 15 10, 25 10, 30 20" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 30 16 C 36 6, 48 6, 54 16" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 54 12 C 62 3, 76 3, 84 12" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 84 9 C 93 1, 107 1, 116 9" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 116 12 C 124 3, 138 3, 146 12" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 146 16 C 152 6, 164 6, 170 16" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 170 20 C 175 10, 185 10, 190 20" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Collar / Tape between Cork and Feathers -->
    <path d="M 67 180 L 133 180 L 130 196 L 70 196 Z" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Cork Base (The Rounded Head) -->
    <path d="M 70 196 C 70 238, 130 238, 130 196 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Cork Highlight Arc -->
    <path d="M 80 202 C 82 224, 118 224, 120 202" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Ambient Light Orbs / Particles -->
  <circle cx="420" cy="90" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="450" cy="140" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="360" cy="50" r="4.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="160" cy="200" r="5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="110" cy="240" r="3" fill="#FFFFFF" opacity="0.3"/>
</svg>

